global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot 微服务（通过 Nacos 服务发现，此处预留静态配置）
  - job_name: 'spring-boot-apps'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets:
        - 'host.docker.internal:9301'
        - 'host.docker.internal:9302'
        - 'host.docker.internal:9303'
        - 'host.docker.internal:9304'
        - 'host.docker.internal:9311'
        - 'host.docker.internal:9312'
        - 'host.docker.internal:9313'
        - 'host.docker.internal:9314'
        - 'host.docker.internal:9321'
        - 'host.docker.internal:9322'
        - 'host.docker.internal:9331'
        - 'host.docker.internal:9341'
        - 'host.docker.internal:9351'
        - 'host.docker.internal:9352'
        - 'host.docker.internal:9361'
        - 'host.docker.internal:9371'
        - 'host.docker.internal:9372'
        - 'host.docker.internal:9381'
        - 'host.docker.internal:8999'

  # 中间件监控（如已启用对应 Exporter 则取消注释）
  # - job_name: 'mysql'
  #   static_configs:
  #     - targets: ['mysql-exporter:9104']
