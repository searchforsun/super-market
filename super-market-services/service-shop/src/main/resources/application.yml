spring:
  application:
    name: shop-service
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  config:
    import: "optional:nacos:${DOCKER_HOST_IP:localhost}:${NACOS_PORT:8848}"

server:
  port: ${SERVER_PORT:9341}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    path: /api/shop/v3/api-docs
  group-configs:
    - group: service-shop
      paths-to-match: /api/shop/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always