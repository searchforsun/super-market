spring:
  application:
    name: file-service
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  config:
    import: "optional:nacos:localhost:8848"

server:
  port: ${SERVER_PORT:9371}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    path: /api/file/v3/api-docs
  group-configs:
    - group: service-file
      paths-to-match: /api/file/**
