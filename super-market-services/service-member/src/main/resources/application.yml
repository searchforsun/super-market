spring:
  application:
    name: member-service
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  config:
    import: "optional:nacos:${DOCKER_HOST_IP:localhost}:${NACOS_PORT:8848}"

server:
  port: ${SERVER_PORT:9303}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    path: /api/member/v3/api-docs
  group-configs:
    - group: service-member
      paths-to-match: /api/member/**
