spring:
  cloud:
    nacos:
      discovery:
        server-addr: ${DOCKER_HOST_IP:localhost}:${NACOS_PORT:8848}
        namespace:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        enabled: false
  autoconfigure:
    exclude:
      - io.seata.spring.boot.autoconfigure.SeataAutoConfiguration
  datasource:
    url: jdbc:mysql://${DOCKER_HOST_IP:localhost}:${MYSQL_PORT:3306}/db_marketing?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${DOCKER_HOST_IP:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id

dubbo:
  application:
    name: seckill-service-test
    qos-enable: false
  protocol:
    name: tri
    port: -1
  registry:
    address: nacos://${DOCKER_HOST_IP:localhost}:${NACOS_PORT:8848}?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}

rocketmq:
  name-server: ${DOCKER_HOST_IP:localhost}:${ROCKETMQ_NAMESRV_PORT:9876}
  producer:
    group: seckill-test-producer

seata:
  enabled: false

logging:
  level:
    com.supermarket: DEBUG
