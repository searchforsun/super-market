spring:
  datasource:
    url: jdbc:mysql://localhost:13306/db_payment?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 5000

  data:
    redis:
      host: localhost
      port: 16379
      password: redis123
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

dubbo:
  application:
    name: user-service
    qos-enable: false
  protocol:
    name: tri
    port: -1
  registry:
    address: nacos://localhost:8848
    parameters:
      namespace: public
  consumer:
    check: false
    timeout: 5000
    retries: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.supermarket.user.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.supermarket: DEBUG
    com.baomidou: WARN
