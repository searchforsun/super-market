spring:
  cloud:
    config:
      import-check:
        enabled: false
  datasource:
    url: jdbc:mysql://localhost:13306/db_order?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 5000

  data:
    redis:
      host: localhost
      port: 16379
      password: redis123
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

dubbo:
  application:
    name: order-service
    qos-enable: false
  protocol:
    name: tri
    port: -1
  registry:
    address: nacos://localhost:8848
    parameters:
      namespace: public
  config-center:
    address: nacos://localhost:8848
  consumer:
    check: false
    timeout: 5000
    retries: 0

rocketmq:
  name-server: localhost:19876
  producer:
    group: order-producer-group
  consumer:
    group: order-consumer-group

seata:
  enabled: true
  application-id: order-service
  tx-service-group: super-market-tx-group
  service:
    vgroup-mapping:
      super-market-tx-group: default
    grouplist:
      default: localhost:19091
  data-source-proxy-mode: AT

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.supermarket.order.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.supermarket: DEBUG
    com.baomidou: WARN
