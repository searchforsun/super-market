spring:
  cloud:
    config:
      import-check:
        enabled: false
  datasource:
    url: jdbc:mysql://${DOCKER_HOST_IP:localhost}:${MYSQL_PORT:3306}/db_order?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 5000

  data:
    redis:
      host: ${DOCKER_HOST_IP:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

dubbo:
  application:
    name: order-service
    qos-enable: false
  protocol:
    name: tri
    port: -1
  registry:
    address: nacos://${DOCKER_HOST_IP:localhost}:${NACOS_PORT:8848}?group=dubbo&username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos123}
    parameters:
      namespace: public
  config-center:
    address: nacos://${DOCKER_HOST_IP:localhost}:${NACOS_PORT:8848}?group=dubbo&username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos123}
    highest-priority: false
  consumer:
    check: false
    timeout: 5000
    retries: 0

rocketmq:
  name-server: ${DOCKER_HOST_IP:localhost}:${ROCKETMQ_NAMESRV_PORT:9876}
  producer:
    group: order-producer-group
  consumer:
    group: order-consumer-group

seata:
  enabled: true
  application-id: order-service
  tx-service-group: super-market-tx-group
  service:
    vgroup-mapping:
      super-market-tx-group: default
    grouplist:
      default: ${DOCKER_HOST_IP:localhost}:${SEATA_PORT:8091}
  data-source-proxy-mode: AT

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.supermarket.order.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.supermarket: DEBUG
    com.baomidou: WARN
