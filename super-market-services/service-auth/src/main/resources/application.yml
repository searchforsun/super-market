spring:
  application:
    name: auth-service
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  config:
    import: "optional:nacos:localhost:8848"

server:
  port: ${SERVER_PORT:9302}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    path: /api/auth/v3/api-docs
  group-configs:
    - group: service-auth
      paths-to-match: /api/auth/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
