spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  main:
    web-application-type: reactive
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/product/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/cart/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/order/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/**
        - id: coupon-service
          uri: lb://coupon-service
          predicates:
            - Path=/api/coupon/**
        - id: seckill-service
          uri: lb://seckill-service
          predicates:
            - Path=/api/seckill/**
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/search/**
        - id: shop-service
          uri: lb://shop-service
          predicates:
            - Path=/api/shop/**
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/file/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123

server:
  port: 8080

jwt:
  secret: super-market-default-secret-key-change-in-production-min-256-bits
  access-token-expire: 7200
  refresh-token-expire: 604800

logging:
  level:
    com.supermarket.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
