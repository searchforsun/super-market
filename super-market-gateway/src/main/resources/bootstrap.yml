spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: reactive
  cloud:
    nacos:
      config:
        # 配置中心相关配置，默认加载 ${spring.application.name}-${spring.profiles.active}.yaml，优先级最高
        server-addr: ${DOCKER_HOST_IP:localhost}:${NACOS_PORT:8848}
        namespace: public
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: DEFAULT_GROUP
        file-extension: yaml
        enabled: true
        # 共享配置 — 所有微服务共用的基础配置（优先级最低）
        shared-configs:
          - data-id: common-redis.yaml
            group: DEFAULT_GROUP
            refresh: true
      discovery:
        server-addr: ${DOCKER_HOST_IP:localhost}:${NACOS_PORT:8848}
        namespace: public
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        enabled: true

server:
  port: ${SERVER_PORT:8999}
