    - heading "7. 关键场景技术方案" [level=3] [ref=e728]
    - heading "7.1 秒杀场景" [level=4] [ref=e729]
    - generic [ref=e730]:
      - text: text
      - code [ref=e731]: "时间线: T-1h 秒杀商品预热: 秒杀库存加载到Redis, 商品信息加载到本地缓存 T-5min 用户进入秒杀页面: WebSocket推送倒计时 T-0 秒杀开始 请求链路: 用户点击秒杀 → Gateway限流 (Sentinel: 令牌桶, 10000 QPS) → SeckillService.seckill(userId, seckillSkuId) → Redisson分布式锁 (key: smt:lock:seckill:{skuId}:{userId}) → Redis Lua脚本原子扣减秒杀库存 if redis.call('get', KEYS[1]) > 0 then redis.call('decr', KEYS[1]) return 1 -- 抢到 else return 0 -- 已抢完 end → 抢到: 发送RocketMQ消息异步创建订单 → 未抢到: 返回\"已抢光\" 异步下单流程: RocketMQ Consumer → 创建预订单 → 扣减真实库存 → 返回订单号 WebSocket推送结果给用户"
    - heading "7.2 分布式事务（下单核心链路）" [level=4] [ref=e732]
    - generic [ref=e733]:
      - generic [ref=e734]: 订单服务 (TM) 事务发起方
      - generic [ref=e735]: 库存服务 (RM) deductStock Seata代理数据源 undo_log回滚
      - generic [ref=e736]: 优惠券服务 (RM) useCoupon Seata代理数据源
      - generic [ref=e737]: 订单服务 (RM) createOrder INSERT orders + order_items
    - heading "7.3 库存扣减方案" [level=4] [ref=e738]
    - generic [ref=e739]:
      - text: text
      - code [ref=e740]: "方案: Redis预减 + DB最终一致 下单流程: 1. 检查 Redis 库存 (> 0) 2. Redis 预减库存 (DECR) 3. 发送 RocketMQ 消息 4. 消费端: DB 真实扣减 (乐观锁) UPDATE inventory SET available_stock = available_stock - #{quantity}, locked_stock = locked_stock + #{quantity}, version = version + 1 WHERE sku_id = #{skuId} AND available_stock >= #{quantity} AND version = #{version} 5. DB扣减失败 → 重试 (最多3次) → 最终失败 → Redis库存补偿 + 告警 超时释放: - RocketMQ延迟消息 (30min) - 消费端检查订单状态 = 待付款 → 取消订单 + 释放库存 防止超卖: - DB层面: 乐观锁 version 保证 - Redis层面: Lua脚本原子操作 - 对账: 定时任务对比 Redis 和 DB 库存, 差异告警"
