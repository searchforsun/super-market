      - code [ref=e654]: "商家提交商品审核通过: 1. 商品服务发送半消息 (RocketMQ事务消息, Tag: PRODUCT_APPROVED) 2. 商品服务执行本地事务: - 更新 spu.audit_status = 1 - 写入 spu 和 sku 记录 3. 本地事务成功 → 提交消息 4. 索引同步服务消费: - 构建ES索引文档 - 同步到 ES 如果本地事务失败 → 回滚半消息 → 消费者不会收到"
