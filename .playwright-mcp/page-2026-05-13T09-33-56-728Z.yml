      - text: java
      - code [ref=e542]: "// 创建商品(商家) POST /api/product/spu Request: { name, categoryId, brandId, images, skus: [...], description } Response: { spuId } // 商品详情(SPU + SKU列表) GET /api/product/spu/{spuId} Response: { spuId, name, category, brand, skus: [...], images, status } // 商品列表(分页+筛选) GET /api/product/list?page=1&size=20&categoryId=xxx&keyword=xxx&sort=price_asc Response: { total, records: [...], pages } // 商品审核(运营) PUT /api/product/spu/{spuId}/audit Request: { status: APPROVED|REJECTED, reason }"
    - paragraph [ref=e543]:
