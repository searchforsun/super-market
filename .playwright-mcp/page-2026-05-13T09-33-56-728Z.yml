    - generic [ref=e545]:
      - text: java
      - code [ref=e546]: "// 扣减库存(订单创建时) Dubbo: InventoryService.deduct(List<DeductItem> items) DeductItem: { skuId, quantity, orderNo } Response: { success, failedItems: [...] } // 回补库存(取消订单/退款) Dubbo: InventoryService.restore(List<RestoreItem> items) // 查询库存 GET /api/inventory/sku/{skuId} Response: { skuId, totalStock, availableStock, lockedStock }"
