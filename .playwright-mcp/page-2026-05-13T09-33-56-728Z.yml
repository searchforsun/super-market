    - heading "4.2 Redis Key 设计规范" [level=4] [ref=e645]
    - generic [ref=e646]:
      - text: text
      - code [ref=e647]: "Key 命名规范: {项目前缀}:{业务域}:{业务含义}:{标识} # 用户相关 smt:user:token:{userId} → JWT Token (TTL: 7d) smt:user:info:{userId} → 用户信息 Hash (TTL: 1h) # 商品相关 smt:product:spu:{spuId} → SPU详情 Hash (TTL: 30min) smt:product:sku:{skuId} → SKU信息 Hash (TTL: 30min) smt:product:category:tree → 类目树 JSON (TTL: 1h) # 库存相关 smt:inventory:stock:{skuId} → 库存数量 (TTL: 永久) smt:inventory:stock:lock:{skuId} → 分布式锁 Key (TTL: 30s) # 购物车 smt:cart:{userId} → Hash {skuId: quantity} (TTL: 30d) # 秒杀 smt:seckill:product:{spuId} → 秒杀商品信息 (预热加载) smt:seckill:stock:{skuId} → 秒杀库存 (预扣减, TTL: 活动结束) # 订单 smt:order:info:{orderNo} → 订单详情 Hash (TTL: 1h) smt:order:repeat:{requestId} → 幂等Key (TTL: 1h) # 通用 smt:lock:{resource}:{id} → 分布式锁 (TTL: 30s) smt:rate:{api}:{ip} → 限流计数 (TTL: 1s)"
    - heading "5. 消息队列设计" [level=3] [ref=e648]
    - heading "5.1 Topic 规划" [level=4] [ref=e649]
    - generic [ref=e650]:
      - text: text
      - code [ref=e651]: "RocketMQ Topic 设计: Topic: order-event-topic 订单事件 Tag: ORDER_CREATED 订单创建 → 通知服务发消息, 营销服务发积分 Tag: ORDER_PAID 支付成功 → 通知商家发货, 数据服务统计 Tag: ORDER_SHIPPED 已发货 → 通知用户 Tag: ORDER_CANCELLED 已取消 → 库存回补, 优惠券退回 Tag: ORDER_REFUNDED 已退款 → 库存回补, 数据服务 Topic: product-event-topic 商品事件 Tag: PRODUCT_APPROVED 商品审核通过 → 索引同步服务更新ES Tag: PRODUCT_UPDATED 商品更新 → 索引同步, 缓存清理 Tag: PRODUCT_SHELF_CHANGE 上下架变更 → 索引同步, 缓存清理 Topic: inventory-event-topic 库存事件 Tag: STOCK_CHANGED 库存变更 → 同步ES库存 Tag: STOCK_ALARM 库存不足预警 → 通知商家 Topic: delay-order-topic 延迟消息(订单超时) Tag: ORDER_PAYMENT_TIMEOUT 下单后30min未支付 → RocketMQ延迟消息Level 16 Topic: canal-sync-topic Canal数据同步 Tag: BINLOG_CHANGE DB变更事件 → 更新ES/缓存/ClickHouse"
    - heading "5.2 事务消息（商品上架示例）" [level=4] [ref=e652]
    - generic [ref=e653]:
