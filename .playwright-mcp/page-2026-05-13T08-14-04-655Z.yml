    - paragraph [ref=e22]:
      - strong [ref=e23]: "Goal:"
      - text: 搭建完整的本地开发环境（Docker Compose 中间件集群 + Maven 多模块项目骨架 + 16 个微服务脚手架 + Gateway + CI/CD + K8s 基础配置），使团队可以立即开始编码。
    - paragraph [ref=e24]:
      - strong [ref=e25]: "Architecture:"
      - text: Maven 多模块父子工程架构。顶层 parent POM 统一管理 Spring Boot 3.2 / Dubbo 3.2 / Spring Cloud 2023.0 等全部依赖版本。common 层提供共享代码（DTO/异常/工具/安全/持久层配置）。每个微服务是独立 Spring Boot 模块，通过 Dubbo RPC 互调，通过 Nacos 注册发现。
    - paragraph [ref=e26]:
      - strong [ref=e27]: "Tech Stack:"
      - text: Java 21, Spring Boot 3.2, Apache Dubbo 3.2, Nacos 2.3, Maven 3.9, Docker Compose, MySQL 8.0, Redis 7.2, RocketMQ 5.1, Elasticsearch 7.17
