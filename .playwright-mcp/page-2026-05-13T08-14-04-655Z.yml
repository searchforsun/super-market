    - generic [ref=e631]:
      - text: java
      - code [ref=e632]: "package com.supermarket.gateway.filter; import com.supermarket.common.core.constants.GlobalConstants; import com.supermarket.common.security.util.JwtUtil; import lombok.RequiredArgsConstructor; import lombok.extern.slf4j.Slf4j; import org.springframework.cloud.gateway.filter.GatewayFilterChain; import org.springframework.cloud.gateway.filter.GlobalFilter; import org.springframework.core.Ordered; import org.springframework.core.io.buffer.DataBuffer; import org.springframework.http.HttpHeaders; import org.springframework.http.HttpStatus; import org.springframework.http.MediaType; import org.springframework.http.server.reactive.ServerHttpRequest; import org.springframework.http.server.reactive.ServerHttpResponse; import org.springframework.stereotype.Component; import org.springframework.web.server.ServerWebExchange; import reactor.core.publisher.Mono; import java.nio.charset.StandardCharsets; import java.util.List; @Slf4j @Component @RequiredArgsConstructor public class AuthGlobalFilter implements GlobalFilter, Ordered { private final JwtUtil jwtUtil; private static final List<String> WHITELIST = List.of( \"/api/user/register\", \"/api/user/login\", \"/api/auth/login\", \"/actuator\", \"/doc.html\", \"/v3/api-docs\" ); @Override public Mono<Void> filter(ServerWebExchange exchange, GatewayFilterChain chain) { ServerHttpRequest request = exchange.getRequest(); String path = request.getURI().getPath(); // 白名单放行 if (WHITELIST.stream().anyMatch(path::startsWith)) { return chain.filter(exchange); } // 提取 Token String authHeader = request.getHeaders().getFirst(HttpHeaders.AUTHORIZATION); if (authHeader == null || !authHeader.startsWith(\"Bearer \")) { return unauthorized(exchange, \"未提供认证 Token\"); } String token = authHeader.substring(7); // 验证 Token if (!jwtUtil.validate(token)) { return unauthorized(exchange, \"Token 无效或已过期\"); } if (jwtUtil.isExpired(token)) { return unauthorized(exchange, \"Token 已过期\"); } // 透传用户信息到下游 Long userId = jwtUtil.getUserId(token); List<String> roles = jwtUtil.getRoles(token); ServerHttpRequest mutatedRequest = request.mutate() .header(GlobalConstants.USER_ID, String.valueOf(userId)) .header(GlobalConstants.USER_ROLES, String.join(\",\", roles)) .build(); return chain.filter(exchange.mutate().request(mutatedRequest).build()); } private Mono<Void> unauthorized(ServerWebExchange exchange, String message) { ServerHttpResponse response = exchange.getResponse(); response.setStatusCode(HttpStatus.UNAUTHORIZED); response.getHeaders().setContentType(MediaType.APPLICATION_JSON); String body = \"{\\\"code\\\":401,\\\"message\\\":\\\"\" + message + \"\\\"}\"; DataBuffer buffer = response.bufferFactory().wrap(body.getBytes(StandardCharsets.UTF_8)); return response.writeWith(Mono.just(buffer)); } @Override public int getOrder() { return -100; } }"
