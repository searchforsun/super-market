      - code [ref=e625]: "package com.supermarket.gateway; import org.springframework.boot.SpringApplication; import org.springframework.boot.autoconfigure.SpringBootApplication; @SpringBootApplication(scanBasePackages = { \"com.supermarket.gateway\", \"com.supermarket.common\" }) public class GatewayApplication { public static void main(String[] args) { SpringApplication.run(GatewayApplication.class, args); } }"
