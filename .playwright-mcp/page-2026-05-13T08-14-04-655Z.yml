        - strong [ref=e145]: "Step 1: 写入完整的 Docker Compose 编排文件"
    - paragraph [ref=e146]:
      - text: 写入
      - code [ref=e147]: middleware-docker/middleware-docker.yml
      - text: ":"
    - generic [ref=e148]:
      - text: yaml
      - code [ref=e149]: "version: '3.8' networks: smt-net: driver: bridge ipam: config: - subnet: ${SUBNET:-10.10.0.0/16} services: # ============================ # MySQL 8.0 # ============================ mysql: image: mysql:8.0.35 container_name: smt-mysql restart: unless-stopped environment: MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123} TZ: Asia/Shanghai ports: - \"${MYSQL_PORT:-3306}:3306\" volumes: - mysql-data:/var/lib/mysql - ./mysql/init:/docker-entrypoint-initdb.d - ./mysql/conf:/etc/mysql/conf.d networks: - smt-net healthcheck: test: [\"CMD\", \"mysqladmin\", \"ping\", \"-h\", \"localhost\", \"-u\", \"root\", \"-p${MYSQL_ROOT_PASSWORD}\"] interval: 10s timeout: 5s retries: 5 # ============================ # Redis 7.2 # ============================ redis: image: redis:7.2-alpine container_name: smt-redis restart: unless-stopped command: > redis-server --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes ports: - \"${REDIS_PORT:-6379}:6379\" volumes: - redis-data:/data networks: - smt-net healthcheck: test: [\"CMD\", \"redis-cli\", \"-a\", \"${REDIS_PASSWORD}\", \"ping\"] interval: 10s timeout: 5s retries: 5 # ============================ # Nacos 2.3 (单机模式) # ============================ nacos: image: nacos/nacos-server:v2.3.1 container_name: smt-nacos restart: unless-stopped environment: MODE: standalone NACOS_AUTH_ENABLE: \"true\" NACOS_AUTH_TOKEN_EXPIRE_SECONDS: \"86400\" NACOS_AUTH_IDENTITY_KEY: serverIdentity NACOS_AUTH_IDENTITY_VALUE: security SPRING_DATASOURCE_PLATFORM: mysql MYSQL_SERVICE_HOST: mysql MYSQL_SERVICE_PORT: 3306 MYSQL_SERVICE_DB_NAME: nacos MYSQL_SERVICE_USER: root MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123} ports: - \"${NACOS_PORT:-8848}:8848\" - \"${NACOS_GRPC_PORT:-9848}:9848\" volumes: - nacos-data:/home/nacos/data networks: - smt-net depends_on: mysql: condition: service_healthy healthcheck: test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8848/nacos/v1/console/health/readiness\"] interval: 15s timeout: 10s retries: 10 # ============================ # RocketMQ 5.1 # ============================ rocketmq-namesrv: image: apache/rocketmq:5.1.4 container_name: smt-rocketmq-namesrv restart: unless-stopped command: sh mqnamesrv ports: - \"${ROCKETMQ_NAMESRV_PORT:-9876}:9876\" volumes: - rocketmq-namesrv-data:/home/rocketmq/store networks: - smt-net healthcheck: test: [\"CMD\", \"sh\", \"-c\", \"curl -s localhost:9876 >/dev/null || exit 1\"] interval: 15s timeout: 10s retries: 5 rocketmq-broker: image: apache/rocketmq:5.1.4 container_name: smt-rocketmq-broker restart: unless-stopped command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf ports: - \"${ROCKETMQ_BROKER_PORT:-10911}:10911\" - \"10909:10909\" volumes: - rocketmq-broker-data:/home/rocketmq/store - ./rocketmq/conf/broker.conf:/home/rocketmq/conf/broker.conf networks: - smt-net depends_on: rocketmq-namesrv: condition: service_healthy # ============================ # Elasticsearch 7.17（Docker Hub 官方镜像） # ============================ elasticsearch: image: elasticsearch:7.17.23 container_name: smt-elasticsearch restart: unless-stopped environment: discovery.type: single-node ES_JAVA_OPTS: \"-Xms512m -Xmx512m\" xpack.security.enabled: \"false\" xpack.security.http.ssl.enabled: \"false\" xpack.security.transport.ssl.enabled: \"false\" ports: - \"${ES_PORT:-9200}:9200\" - \"${ES_TRANSPORT_PORT:-9300}:9300\" volumes: - es-data:/usr/share/elasticsearch/data - ./elasticsearch/config:/usr/share/elasticsearch/config networks: - smt-net healthcheck: test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:9200/_cluster/health\"] interval: 15s timeout: 10s retries: 10 # ============================ # MinIO 对象存储 # ============================ minio: image: quay.io/minio/minio:RELEASE.2024-05-10T01-41-38Z container_name: smt-minio restart: unless-stopped command: server /data --console-address \":9001\" environment: MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin} MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123} ports: - \"${MINIO_API_PORT:-9000}:9000\" - \"${MINIO_CONSOLE_PORT:-9001}:9001\" volumes: - minio-data:/data networks: - smt-net healthcheck: test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:9000/minio/health/live\"] interval: 10s timeout: 5s retries: 5 # ============================ # XXL-Job 2.4 # ============================ xxl-job-admin: image: xuxueli/xxl-job-admin:2.4.1 container_name: smt-xxl-job restart: unless-stopped environment: PARAMS: > --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-root123} --xxl.job.accessToken=xxl-job-access-token-2024 ports: - \"${XXL_JOB_PORT:-8081}:8080\" networks: - smt-net depends_on: mysql: condition: service_healthy # ============================ # Sentinel Dashboard 1.8 # ============================ sentinel-dashboard: image: bladex/sentinel-dashboard:1.8.6 container_name: smt-sentinel restart: unless-stopped environment: SERVER_PORT: 8858 AUTH_USERNAME: ${SENTINEL_USERNAME:-sentinel} AUTH_PASSWORD: ${SENTINEL_PASSWORD:-sentinel123} NACOS_SERVER_ADDR: nacos:8848 ports: - \"${SENTINEL_PORT:-8858}:8858\" networks: - smt-net depends_on: nacos: condition: service_healthy # ============================ # SkyWalking 9.7 # ============================ skywalking-oap: image: apache/skywalking-oap-server:9.7.0 container_name: smt-skywalking-oap restart: unless-stopped environment: SW_STORAGE: elasticsearch SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200 JAVA_OPTS: \"-Xms512m -Xmx512m\" ports: - \"${SKYWALKING_GRPC_PORT:-11800}:11800\" - \"${SKYWALKING_HTTP_PORT:-12800}:12800\" networks: - smt-net depends_on: elasticsearch: condition: service_healthy skywalking-ui: image: apache/skywalking-ui:9.7.0 container_name: smt-skywalking-ui restart: unless-stopped environment: SW_OAP_ADDRESS: http://skywalking-oap:12800 ports: - \"8082:8080\" networks: - smt-net depends_on: - skywalking-oap # ============================ # Canal 1.1.x # ============================ canal-server: image: canal/canal-server:v1.1.7 container_name: smt-canal restart: unless-stopped environment: CANAL_ADMIN_MANAGER: \"\" canal.instance.master.address: mysql:3306 canal.instance.dbUsername: root canal.instance.dbPassword: ${MYSQL_ROOT_PASSWORD:-root123} canal.instance.filter.regex: .*\\\\..* ports: - \"${CANAL_PORT:-11111}:11111\" networks: - smt-net depends_on: mysql: condition: service_healthy volumes: mysql-data: redis-data: nacos-data: rocketmq-namesrv-data: rocketmq-broker-data: es-data: minio-data:"
