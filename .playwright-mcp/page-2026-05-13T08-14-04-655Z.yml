    - blockquote [ref=e19]:
      - strong [ref=e20]: "For agentic workers:"
      - text: "REQUIRED SUB-SKILL: Use superpowers:subagent-driven-development (recommended) or superpowers:executing-plans to implement this plan task-by-task. Steps use checkbox ("
      - code [ref=e21]: "- [ ]"
