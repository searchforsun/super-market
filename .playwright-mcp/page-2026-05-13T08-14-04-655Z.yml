    - generic [ref=e329]:
      - text: java
      - code [ref=e330]: "package com.supermarket.common.security.util; import com.supermarket.common.security.config.JwtProperties; import io.jsonwebtoken.Claims; import io.jsonwebtoken.Jwts; import io.jsonwebtoken.security.Keys; import lombok.RequiredArgsConstructor; import org.springframework.stereotype.Component; import javax.crypto.SecretKey; import java.nio.charset.StandardCharsets; import java.util.Date; import java.util.List; @Component @RequiredArgsConstructor public class JwtUtil { private final JwtProperties jwtProperties; private SecretKey getKey() { return Keys.hmacShaKeyFor(jwtProperties.getSecret().getBytes(StandardCharsets.UTF_8)); } public String generateAccessToken(Long userId, List<String> roles) { Date now = new Date(); return Jwts.builder() .issuer(jwtProperties.getIssuer()) .subject(String.valueOf(userId)) .claim(\"roles\", roles) .issuedAt(now) .expiration(new Date(now.getTime() + jwtProperties.getAccessTokenExpire() * 1000)) .signWith(getKey()) .compact(); } public String generateRefreshToken(Long userId) { Date now = new Date(); return Jwts.builder() .issuer(jwtProperties.getIssuer()) .subject(String.valueOf(userId)) .issuedAt(now) .expiration(new Date(now.getTime() + jwtProperties.getRefreshTokenExpire() * 1000)) .signWith(getKey()) .compact(); } public Claims parseToken(String token) { return Jwts.parser() .verifyWith(getKey()) .build() .parseSignedClaims(token) .getPayload(); } public Long getUserId(String token) { return Long.valueOf(parseToken(token).getSubject()); } @SuppressWarnings(\"unchecked\") public List<String> getRoles(String token) { return parseToken(token).get(\"roles\", List.class); } public boolean isExpired(String token) { try { return parseToken(token).getExpiration().before(new Date()); } catch (Exception e) { return true; } } public boolean validate(String token) { try { parseToken(token); return true; } catch (Exception e) { return false; } } }"
