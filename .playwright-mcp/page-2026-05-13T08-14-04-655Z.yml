    - generic [ref=e665]:
      - text: yaml
      - code [ref=e666]: "# Super Market — GitLab CI/CD 流水线定义 # 4 阶段: check → test → build → deploy variables: MAVEN_OPTS: \"-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository\" MAVEN_CLI_OPTS: \"--batch-mode --errors --fail-at-end --show-version\" DOCKER_DRIVER: overlay2 HARBOR_URL: harbor.local HARBOR_PROJECT: super-market cache: key: ${CI_COMMIT_REF_SLUG} paths: - .m2/repository/ stages: - check - test - build - deploy # ========================================== # Stage 1: 代码检查 # ========================================== checkstyle: stage: check image: maven:3.9-eclipse-temurin-21 script: - mvn checkstyle:check $MAVEN_CLI_OPTS || true allow_failure: true only: - merge_requests - master # ========================================== # Stage 2: 构建 + 单元测试 # ========================================== unit-test: stage: test image: maven:3.9-eclipse-temurin-21 services: - name: mysql:8.0.35 alias: mysql variables: MYSQL_ROOT_PASSWORD: root123 - name: redis:7.2-alpine alias: redis variables: SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_user SPRING_DATASOURCE_USERNAME: root SPRING_DATASOURCE_PASSWORD: root123 SPRING_REDIS_HOST: redis script: - mvn clean test $MAVEN_CLI_OPTS artifacts: when: always reports: junit: - \"**/target/surefire-reports/TEST-*.xml\" paths: - \"**/target/surefire-reports/\" coverage: '/Total.*?([0-9]{1,3})%$/' only: - merge_requests - master # ========================================== # Stage 3: 镜像打包 + 推送 # ========================================== docker-build: stage: build image: docker:24-dind services: - docker:24-dind before_script: - echo \"$HARBOR_PASSWORD\" | docker login $HARBOR_URL -u \"$HARBOR_USERNAME\" --password-stdin script: - | SERVICES=( \"service-user\" \"service-auth\" \"service-member\" \"service-address\" \"service-product\" \"service-category\" \"service-inventory\" \"service-review\" \"service-cart\" \"service-order\" \"service-payment\" \"service-coupon\" \"service-seckill\" \"service-search\" \"service-shop\" \"service-platform\" \"service-file\" \"service-notify\" ) for svc in \"${SERVICES[@]}\"; do echo \"Building $svc...\" cd super-market-services/$svc docker build -t $HARBOR_URL/$HARBOR_PROJECT/$svc:$CI_COMMIT_SHORT_SHA . docker push $HARBOR_URL/$HARBOR_PROJECT/$svc:$CI_COMMIT_SHORT_SHA docker tag $HARBOR_URL/$HARBOR_PROJECT/$svc:$CI_COMMIT_SHORT_SHA $HARBOR_URL/$HARBOR_PROJECT/$svc:latest docker push $HARBOR_URL/$HARBOR_PROJECT/$svc:latest cd $CI_PROJECT_DIR done echo \"Building gateway...\" cd super-market-gateway docker build -t $HARBOR_URL/$HARBOR_PROJECT/gateway:$CI_COMMIT_SHORT_SHA . docker push $HARBOR_URL/$HARBOR_PROJECT/gateway:$CI_COMMIT_SHORT_SHA only: - master when: manual # ========================================== # Stage 4: K8s 部署（滚动发布） # ========================================== deploy-to-k8s: stage: deploy image: bitnami/kubectl:1.29 script: - | SERVICES=( \"service-user\" \"service-auth\" \"service-member\" \"service-address\" \"service-product\" \"service-category\" \"service-inventory\" \"service-review\" \"service-cart\" \"service-order\" \"service-payment\" \"service-coupon\" \"service-seckill\" \"service-search\" \"service-shop\" \"service-platform\" \"service-file\" \"service-notify\" ) for svc in \"${SERVICES[@]}\"; do kubectl set image deployment/$svc $svc=$HARBOR_URL/$HARBOR_PROJECT/$svc:$CI_COMMIT_SHORT_SHA -n super-market kubectl rollout status deployment/$svc -n super-market --timeout=300s done kubectl set image deployment/gateway gateway=$HARBOR_URL/$HARBOR_PROJECT/gateway:$CI_COMMIT_SHORT_SHA -n super-market kubectl rollout status deployment/gateway -n super-market --timeout=300s only: - master when: manual"
